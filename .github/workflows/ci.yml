name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Typecheck and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Both majors package.json's engines field claims to support.
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The optional audio deps (mic, speaker) only matter for `npm run call`;
      # npm tolerates their native build failing on a headless runner.
      - run: npm ci

      - run: npm run build

      - run: npm test

  actionlint:
    name: Lint workflows (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Pinned version and the sha256 published with that release, so the
      # linter can't change underneath us. shellcheck (preinstalled on the
      # runner) lints the bash in every `run:` step too.
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

    steps:
      - uses: actions/checkout@v4

      - name: Install actionlint
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball" actionlint

      - name: Lint workflows
        run: ./actionlint -color
